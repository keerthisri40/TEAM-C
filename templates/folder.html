<!DOCTYPE html>
<html>
<head>
    <title>NovaVoice - {{ title }}</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 90%; max-width: 700px; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #38bdf8; padding-bottom: 10px; }
        .back-btn { background: #334155; color: white; padding: 8px 15px; border-radius: 15px; text-decoration: none; font-size: 14px; font-weight: bold; }
        .email-card { background: #1e293b; padding: 15px; border-radius: 12px; margin-top: 10px; border-left: 4px solid #38bdf8; }
        .sender { color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body>
    <div id="listening-bar" style="background: #fbbf24; color: #000; padding: 8px 20px; border-radius: 20px; font-weight: bold; margin-bottom: 20px;">🎤 System Listening...</div>
    <div class="container">
        <div class="header">
            <h2>{{ title }}</h2>
            <a href="/dashboard" class="back-btn">← DASHBOARD</a>
        </div>
        {% if emails %}
            {% for email in emails %}
            <div class="email-card">
                <div class="sender">Mail {{ loop.index }}: {{ email.sender }}</div>
                <div class="snippet">{{ email.snippet }}</div>
            </div>
            {% endfor %}
        {% else %}
            <div style="text-align: center; color: #64748b; margin-top: 40px;">No messages found.</div>
        {% endif %}
    </div>

    <script>
    function speak(text) {
        return new Promise((resolve) => {
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.onend = () => { setTimeout(resolve, 300); };
            window.speechSynthesis.speak(utterance);
        });
    }

    async function loop() {
        try {
            const res = await fetch('/voice_action', { method: 'POST' });
            const data = await res.json();
            
            if (data.status === "navigate") {
                await speak(data.message);
                window.location.href = data.url;
                return;
            }

            if (data.status === "ask_reply") {
                await speak(data.message); // Reads mail content + asks reply/cancel
                
                // Get User Choice
                const decisionRes = await fetch('/voice_action', { method: 'POST' });
                const decisionData = await decisionRes.json();
                const cmd = decisionData.message.toLowerCase();
                
                if (cmd.includes("reply")) {
                    await speak("What is your reply message?");
                    const contentRes = await fetch('/voice_action', { method: 'POST' });
                    const contentData = await contentRes.json();
                    
                    await fetch('/reply_to_mail', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: contentData.message })
                    });
                    await speak("Reply sent successfully.");
                } else {
                    await speak("Cancelled.");
                }
            } else if (data.message) {
                await speak(data.message);
            }
            loop(); 
        } catch { setTimeout(loop, 1000); }
    }

    window.onload = () => { 
        speak("Viewing {{ title }}"); 
        loop(); 
    };
    </script>
</body>
</html>
