<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NovaVoice - Compose</title>
    <style>
        .compose-card { 
            background: #1e293b; 
            padding: 30px; 
            border-radius: 15px; 
            border: 1px solid #38bdf8; 
            max-width: 600px; 
            margin: 0 auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .field { margin-bottom: 25px; }
        label { 
            color: #38bdf8; 
            display: block; 
            margin-bottom: 8px; 
            font-weight: bold; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
        }
        input, textarea { 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: white; 
            box-sizing: border-box; 
            font-size: 1.1rem; 
        }
        .status-alert { 
            background: #f59e0b; 
            color: #0f172a; 
            padding: 18px; 
            border-radius: 8px; 
            font-weight: 800; 
            margin-top: 25px; 
            text-align: center; 
            border: 2px solid white;
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="compose-card">
    <h2 id="platform-title">New {{ platform|capitalize }} Message</h2>
    
    <div class="field">
        <label>Recipient</label>
        <input type="text" value="{{ session.get('draft_to', '') }}" placeholder="Waiting for voice..." readonly>
    </div>

    <div class="field {% if platform != 'email' %}hidden{% endif %}">
        <label>Subject</label>
        <input type="text" value="{{ session.get('draft_sub', '') }}" placeholder="Dictate subject..." readonly>
    </div>

    <div class="field">
    <label>Content</label>
    <textarea id="content" rows="6" placeholder="Waiting for dictation..." readonly>
        {{ session.get('draft_body', '') }}
    </textarea>
</div>


    {% if session.get('step') == 'confirm' %}
    <div class="status-alert">
        <i class="fas fa-microphone"></i> ACTION REQUIRED: SAY "SEND" OR "CANCEL"
    </div>
    {% endif %}
</div>

<script>
    window.onload = () => {
        const textarea = document.getElementById('content');
        if(textarea) textarea.scrollTop = textarea.scrollHeight;
    };
</script>

</body>
</html>
