<!DOCTYPE html>
<html>
<head>
    <title>NovaVoice Dashboard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin:0; font-family:'Segoe UI'; background:#0f172a; color:white; display:flex; }
        .sidebar { width:240px; background:#111827; padding:20px; height:100vh; position:relative; }
        .sidebar h2 { color:#38bdf8; margin-bottom:30px; }
        .sidebar a { display:block; padding:12px; margin-bottom:10px; background:#1e293b;
                     border-radius:8px; cursor:pointer; text-decoration:none; color:white; }
        .sidebar a:hover { background:#334155; }
        .main { flex:1; padding:25px; }
        #main-content { min-height:80vh; }
        .voice-btn { position:fixed; bottom:30px; right:30px; background:#38bdf8;
                     border:none; padding:15px 18px; border-radius:50%; cursor:pointer; }
        .logout { position:absolute; bottom:20px; width:200px; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>NovaVoice</h2>
    <a onclick="loadSection('/load/home')">Home</a>
    <a onclick="loadSection('/load/inbox')">Inbox</a>
    <a onclick="loadSection('/load/sent')">Sent</a>
    <a onclick="loadSection('/load/trash')">Trash</a>
    <a onclick="loadSection('/load/compose?platform=email')">Compose Email</a>
    <a onclick="loadSection('/load/compose?platform=whatsapp')">WhatsApp</a>
    <a onclick="loadSection('/load/compose?platform=telegram')">Telegram</a>
    <a onclick="loadSection('/load/analytics')">Analytics</a>

    <div class="logout">
        <a href="/logout" style="background:#7f1d1d;">Logout</a>
    </div>
</div>

<div class="main">
    <div id="main-content"></div>
</div>

<button class="voice-btn" onclick="startVoice()">🎤</button>

<script>
let recognition;
let isListening = false;
let isSpeaking = false;

function speak(text, callback=null) {
    window.speechSynthesis.cancel(); // stop overlapping speech

    const speech = new SpeechSynthesisUtterance(text);
    speech.lang = "en-US";
    speech.rate = 1;

    speech.onstart = () => { isSpeaking = true; };
    speech.onend = () => {
        isSpeaking = false;
        if (callback) callback();
    };

    window.speechSynthesis.speak(speech);
}

function startListening() {
    if (isListening || isSpeaking) return;

    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {
        isListening = true;
        console.log("Listening...");
    };

    recognition.onresult = (event) => {
        const text = event.results[0][0].transcript;
        console.log("You said:", text);
        sendToBackend(text);
    };

    recognition.onerror = () => {
        isListening = false;
        setTimeout(startListening, 1000);
    };

    recognition.onend = () => {
        isListening = false;
    };

    recognition.start();
}

function sendToBackend(text) {
    fetch("/voice_action", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: text })
    })
    .then(res => res.json())
    .then(data => {

        // Handle simple speak response
        if (data.status === "speak") {
            speak(data.message, () => {
                speak("Listening for your commands", startListening);
            });
            return;
        }

        // Handle navigation
        if (data.status === "navigate") {

            // If logout, redirect fully
            if (data.url === "/logout") {
                speak(data.speak, () => {
                    window.location.href = "/logout";
                });
                return;
            }

            fetch(data.url)
            .then(res => res.text())
            .then(html => {
                document.getElementById("main-content").innerHTML = html;

                speak(data.speak, () => {
                    speak("Listening for your commands", startListening);
                });
            });

        } else {
            startListening();
        }
    });
}

/* Sidebar click navigation */
function loadSection(url) {
    fetch(url)
    .then(res => res.text())
    .then(html => {
        document.getElementById("main-content").innerHTML = html;
    });
}

/* Mic button manual trigger */
function startVoice() {
    startListening();
}

/* On dashboard load */
window.onload = function() {
    loadSection('/load/home');

    setTimeout(() => {
        speak("Welcome to NovaVoice dashboard.", () => {
            speak("Listening for your commands.", startListening);
        });
    }, 1000);
};
</script>

</body>
</html>
