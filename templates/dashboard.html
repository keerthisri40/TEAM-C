<!DOCTYPE html>
<html>
<head>
    <title>NovaVoice Dashboard</title>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: #1e293b; padding: 40px; border-radius: 20px; text-align: center; border: 2px solid #38bdf8; width: 350px; }
        .btn { width: 100%; padding: 15px; margin: 10px 0; border-radius: 25px; border: none; font-weight: bold; cursor: pointer; }
        #status { color: #38bdf8; font-style: italic; margin-top: 20px; min-height: 40px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
    <h2 style="color: #38bdf8;">NovaVoice v2.5</h2>
    
    <button onclick="startHandsFree()" class="btn" style="background: #38bdf8; color: #0f172a;">🎤 ACTIVATE VOICE</button>
    
    <button onclick="window.location.href='/inbox'" class="btn" style="background: #334155; color: white;">📥 INBOX</button>
    <button onclick="window.location.href='/sent'" class="btn" style="background: #334155; color: white;">📤 SENT</button>
    <button onclick="window.location.href='/trash'" class="btn" style="background: #334155; color: white;">🗑️ TRASH</button>
    
    <button onclick="window.location.href='/'" class="btn" style="background: #ef4444; color: white;">LOGOUT</button>
    
    <div id="status">Ready for hands-free assistant</div>
</div>

    <script>
        async function startHandsFree() {
            const status = document.getElementById('status');
            status.style.color = "#38bdf8";
            status.innerText = "Listening for recipient (e.g. 'mail1')...";

            try {
                // Step 1: Identify Recipient
                const res = await fetch('/voice_action', {method: 'POST'});
                const data = await res.json();

                if (data.status === "ask_content") {
                    status.innerText = data.message;
                    
                    // Step 2: Automatically start capturing the message body
                    const mailRes = await fetch('/send_dictated_mail', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({ recipient: data.recipient })
                    });
                    const final = await mailRes.json();

                    if (final.status === "success") {
                        status.style.color = "#4ade80";
                        status.innerText = "✅ Email Sent: " + final.message;
                    } else {
                        status.style.color = "#f87171";
                        status.innerText = "❌ " + final.message;
                    }
                } else {
                    status.style.color = "#f87171";
                    status.innerText = "❌ " + data.message;
                }
            } catch (err) {
                status.innerText = "❌ Connection Error: Check Internet";
            }
        }
    </script>
</body>
</html>
